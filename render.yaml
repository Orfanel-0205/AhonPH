# Render Blueprint for the optional LakbayMate Cloud service (FastAPI).
services:
  - type: web
    name: kitaph-cloud
    runtime: python
    rootDir: cloud
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
