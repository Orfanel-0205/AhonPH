plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ph.kitaph.nano'
version = '0.1.0'

android {
  namespace "ph.kitaph.nano"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 26
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Gemini Nano through Android AICore. The model itself is provided by the OS, not bundled.
  // beta2: newer betas pull Kotlin stdlib 2.3, which this Expo SDK 57 toolchain (Kotlin 2.1) cannot compile against.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
}

